<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puerto Rico · Nov 2026</title>
<meta name="theme-color" content="#2e3a29">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f5efe4; --paper:#fbf8f2; --sand:#e8ddca; --line:#dccfb8;
  --sage:#a4ae8e; --olive:#5f6b48; --forest:#2e3a29;
  --cafe:#7b5236; --cafe-d:#4b3527; --terra:#b26f47;
  --ink:#2a251f; --muted:#7f7568;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
  --dial-w:34px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;cursor:pointer}
img{display:block;max-width:100%}
.stage{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.page{max-width:600px;min-height:100%;margin:0 auto;padding:0 18px 60px}
.head{position:sticky;top:0;z-index:5;background:var(--cream);padding-top:12px;margin:0 -4px;padding-left:4px;padding-right:4px}
.head::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;background:linear-gradient(var(--cream),rgba(245,239,228,0));pointer-events:none}

/* ---------- portada ---------- */
.arch{position:relative;height:20vh;min-height:140px;margin:0;padding:12px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--cream);
  border-radius:90px 90px 22px 22px;overflow:hidden;
  background:radial-gradient(circle at 50% 30%,rgba(245,215,160,.5) 0 28px,transparent 29px),linear-gradient(180deg,#cdb68e 0%,#a4ae8e 46%,#5f6b48 78%,#2e3a29 100%)}
.arch::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);pointer-events:none}
.logo{width:34px;height:34px;flex:0 0 auto;border:0;background:none;color:var(--cream);margin:0 auto 4px;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;position:relative;z-index:1}
.logo svg{width:100%;height:100%}
.arch>*{position:relative;z-index:1}
.eyebrow{font-size:.58rem;letter-spacing:.28em;text-transform:uppercase;opacity:.9}
.arch h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(2rem,9vw,2.8rem);line-height:1;margin:3px 0 6px}
.arch .mrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.arch .sub{font-family:var(--serif);font-size:1.2rem;opacity:.92}
.arch .dates{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase}
.count{display:inline-block;padding:3px 10px;border:1px solid rgba(245,239,228,.55);border-radius:99px;font-size:.7rem}

.sec{display:flex;align-items:center;gap:12px;margin:28px 0 12px;font-weight:500;font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--cafe)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.leg{font-family:var(--serif);font-style:italic;font-size:1.1rem;color:var(--olive);margin:4px 0 8px}
.badge{display:inline-block;font-size:.64rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:99px;white-space:nowrap}
.badge.ok{background:#e3e7d6;color:var(--olive)}
.badge.warn{background:#f4e1d3;color:var(--terra)}

/* ---------- filas desplegables (vuelos / hoteles) ---------- */
.fold{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden;transition:box-shadow .2s}
.fold[open]{box-shadow:0 8px 24px rgba(75,53,39,.08)}
.fold>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.fold>summary::-webkit-details-marker{display:none}
.fold .chev{margin-left:auto;flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--cafe);transition:transform .25s}
.fold[open] .chev{transform:rotate(180deg)}
.dot{flex:0 0 8px;height:8px;border-radius:50%}
.dot.ok{background:var(--olive)} .dot.warn{background:var(--terra)}
.fold-body{padding:2px 14px 14px;border-top:1px dashed var(--line);animation:drop .25s ease}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}}

.fl-code{font-weight:500;font-size:.78rem;letter-spacing:.08em;color:var(--cafe-d);min-width:58px}
.fl-route{font-family:var(--serif);font-weight:600;font-size:1.3rem;color:var(--forest);white-space:nowrap}
.fl-route i{font-style:normal;color:var(--sage);font-size:.95rem;margin:0 4px}
.fl-time{font-size:.8rem;color:var(--muted);white-space:nowrap}
.fl-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 10px}
.al-logo{height:26px;width:auto;max-width:120px;object-fit:contain}
.fl-logo{height:16px;width:auto;max-width:56px;object-fit:contain}
.airline{font-weight:500;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);background:var(--cafe);padding:5px 12px;border-radius:8px}
.fl-legs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.pt small{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pt b{display:block;font-family:var(--serif);font-weight:600;font-size:1.8rem;line-height:1.05;color:var(--forest);margin-top:2px}
.pt .ap{font-size:.78rem;line-height:1.3;color:var(--ink);margin-top:2px}
.pt .term{display:inline-block;margin-top:6px;font-size:.72rem;font-weight:500;color:var(--olive);background:#eef0e6;border-radius:6px;padding:2px 7px}
.pt .tm{display:block;margin-top:6px;font-size:.88rem;font-weight:400}
.pt .tm.tbd{color:var(--terra);font-style:italic;font-weight:300}
.fl-foot{font-size:.8rem;color:var(--muted);margin-top:10px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links a{font-size:.76rem;color:var(--cafe);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 11px;background:#fff}

.ht-name{font-family:var(--serif);font-weight:600;font-size:1.15rem;color:var(--forest);line-height:1.1}
.fold.pending{border:1.5px dashed var(--terra);background:#fbf3ec}
.fold-body p{font-size:.86rem;line-height:1.5;margin-top:8px}
.fold-body p.muted{color:var(--muted)}

/* ---------- días ---------- */
.day-hero{position:relative;height:20vh;min-height:140px;padding:14px 18px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--cream);border-radius:22px;overflow:hidden;
  background:radial-gradient(circle at 88% 26%,rgba(205,182,142,.5) 0 36px,transparent 37px),linear-gradient(160deg,var(--olive),var(--forest))}
.day.alt .day-hero{background:radial-gradient(circle at 12% 28%,rgba(245,215,160,.35) 0 32px,transparent 33px),linear-gradient(160deg,var(--cafe),var(--cafe-d))}
.day-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.day-hero.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(30,26,20,.72))}
.day-hero>*:not(img){position:relative;z-index:1}
.day-num{font-family:var(--serif);font-style:italic;font-size:1.05rem;opacity:.9}
.day-date{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;margin-top:3px}
.day-title{font-family:var(--serif);font-weight:500;font-size:clamp(1.7rem,7.5vw,2.3rem);line-height:1;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-inner{padding:0 2px}
.day-inner .sec{margin-top:20px}

.timeline{list-style:none;position:relative;margin-left:2px}
.timeline::before{content:"";position:absolute;left:46px;top:8px;bottom:8px;width:1px;background:var(--line)}
.act{display:grid;grid-template-columns:42px minmax(0,1fr);gap:16px;padding-bottom:18px;position:relative}
.act::before{content:"";position:absolute;left:42px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--cream);border:2px solid var(--olive)}
.act-time{font-size:.8rem;font-weight:500;color:var(--cafe);padding-top:3px;text-align:right}
.act-body{min-width:0}
.act-body h4{font-family:var(--serif);font-size:1.3rem;font-weight:600;line-height:1.15;color:var(--forest)}
.act-body .place{font-size:.84rem;color:var(--olive);margin-top:3px}
.act-body .note{font-size:.9rem;margin-top:6px;line-height:1.5;white-space:pre-line}
.act-body>img{border-radius:16px;margin-top:10px;width:100%;max-height:300px;object-fit:cover}
.act-body>a{display:inline-block;margin-top:8px;font-size:.8rem;color:var(--cafe);text-decoration:none;border-bottom:1px solid var(--line)}
.empty{text-align:center;padding:24px 16px;border:1.5px dashed var(--line);border-radius:18px;color:var(--muted);font-size:.88rem}
.empty b{display:block;font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.35rem;color:var(--olive);margin-bottom:4px}
.end{text-align:center;margin:40px 0 0;font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--olive)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:34px}
.pager button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;color:var(--forest);text-align:left;font-size:.85rem}
.pager button.nx{text-align:right}
.pager button small{display:block;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pager button b{font-family:var(--serif);font-weight:600;font-size:1.1rem}
.pager .sp{flex:1}
.daylist{list-style:none;display:grid;gap:8px}
.daylist button{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 14px;color:var(--ink)}
.daylist .n{flex:0 0 42px;height:42px;border-radius:50%;background:var(--forest);color:var(--cream);display:grid;place-items:center;font-family:var(--serif);font-size:1.25rem;font-weight:600}
.daylist .tx b{display:block;font-weight:400}
.daylist .tx small{color:var(--muted)}
.hint{text-align:center;color:var(--muted);font-size:.8rem;margin:22px 0 0;line-height:1.5}

/* ---------- morph entre pantallas ---------- */
.arch,.day-hero{view-transition-name:hero}
.arch h1,.day-title{view-transition-name:title}
.eyebrow,.day-num{view-transition-name:kicker}
.vbody{view-transition-name:vbody}
.knob{view-transition-name:knob}
.track{view-transition-name:track}
.bubble{view-transition-name:bubble}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-old(knob),::view-transition-old(track),::view-transition-old(bubble){display:none}
::view-transition-new(knob),::view-transition-new(track),::view-transition-new(bubble){animation:none}
::view-transition-group(hero),::view-transition-group(title),::view-transition-group(kicker){animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.85,.25,1)}
::view-transition-old(hero),::view-transition-new(hero){height:100%;object-fit:cover;animation-duration:.45s}
::view-transition-old(vbody){animation:vt-out .26s ease both}
::view-transition-new(vbody){animation:vt-in .48s cubic-bezier(.2,.85,.25,1) .07s both}
html[data-dir=back]::view-transition-old(vbody){animation-name:vt-out-back}
html[data-dir=back]::view-transition-new(vbody){animation-name:vt-in-back}
@keyframes vt-out{to{opacity:0;transform:translateY(-22px) scale(.98);filter:blur(4px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(42px) scale(.98);filter:blur(6px)}}
@keyframes vt-out-back{to{opacity:0;transform:translateY(22px) scale(.98);filter:blur(4px)}}
@keyframes vt-in-back{from{opacity:0;transform:translateY(-42px) scale(.98);filter:blur(6px)}}
@keyframes pop{from{opacity:.4;transform:scale(.96)}}
.page.enter-fwd .vbody{animation:vt-in .45s cubic-bezier(.2,.85,.25,1) both}
.page.enter-back .vbody{animation:vt-in-back .45s cubic-bezier(.2,.85,.25,1) both}
.page.enter-fwd .arch,.page.enter-fwd .day-hero,.page.enter-back .arch,.page.enter-back .day-hero{animation:pop .4s ease both}


/* votaciones */
.poll{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px}
.poll-q{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.7rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--cafe);margin-bottom:9px}
.opt{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;margin-bottom:6px;overflow:hidden;padding-right:10px}
.opt .bar{position:absolute;left:0;top:0;bottom:0;background:#e3e7d6;transition:width .5s ease}
.opt>*:not(.bar){position:relative}
.opt .lbl{flex:1;text-align:left;border:0;background:none;padding:11px 0 11px 12px;color:var(--ink);font-size:.95rem;font-weight:400}
.opt .lbl:disabled{cursor:default}
.opt .meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:42%;min-width:0}
.opt a{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:.75rem;color:var(--cafe);text-decoration:none;white-space:nowrap}
.opt .pct{font-size:.75rem;color:var(--muted);white-space:nowrap}
.opt.mine{border-color:var(--olive);box-shadow:inset 0 0 0 1px var(--olive)}
.opt.mine .lbl{font-weight:500;color:var(--forest)}
.opt.win .bar{background:#dccdb1}
.poll-other{display:flex;gap:6px;margin-top:8px}
.poll-other input{flex:1;min-width:0;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.poll-foot{font-size:.75rem;color:var(--muted);margin-top:6px}

/* ---------- rueda de fechas (derecha) ---------- */
.dial{position:fixed;right:0;top:0;width:0;height:0;z-index:30}
.knob{position:fixed;right:12px;top:70vh;width:50px;height:50px;margin-top:-25px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(251,248,242,.74);border:1px solid rgba(95,107,72,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(46,58,41,.16);color:var(--forest);
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;z-index:2;transition:top .35s cubic-bezier(.2,.85,.25,1),transform .2s,background .2s,box-shadow .2s}
.knob b{font-family:var(--serif);font-weight:600;font-size:1.15rem;line-height:1}
.knob small{font-size:.46rem;letter-spacing:.1em;text-transform:uppercase;margin-top:2px;opacity:.8}
.dial.open .knob{background:rgba(164,174,142,.96);border-color:rgba(95,107,72,.5);transform:scale(1.14);box-shadow:0 10px 26px rgba(46,58,41,.25)}
.dial.drag .knob{transition:transform .2s,background .2s,box-shadow .2s;cursor:grabbing}
.track{position:fixed;right:10px;width:54px;border-radius:27px;background:rgba(245,239,228,.88);border:1px solid rgba(95,107,72,.25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:-6px 0 24px rgba(46,58,41,.14);
  opacity:0;transform:scaleY(.3);pointer-events:none;transition:opacity .2s ease,transform .32s cubic-bezier(.2,.85,.25,1)}
.dial.open .track{opacity:1;transform:none;pointer-events:auto}
.stop{position:absolute;left:0;right:0;height:40px;margin-top:-20px;border:0;background:none;color:var(--forest);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:scale(.5);opacity:0;transition:transform .3s cubic-bezier(.2,.85,.25,1),opacity .25s}
.dial.open .stop{transform:scale(1);opacity:.8}
.stop b{font-family:var(--serif);font-weight:600;font-size:1.15rem;line-height:1}
.stop small{font-size:.46rem;letter-spacing:.1em;text-transform:uppercase;margin-top:2px;opacity:.75}
.stop+.stop::before{content:"";position:absolute;top:-2px;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:rgba(46,58,41,.3)}
.bubble{position:fixed;right:84px;top:70vh;transform:translate(10px,-50%);opacity:0;pointer-events:none;z-index:31;background:var(--cream);color:var(--forest);border:1px solid var(--line);border-radius:14px;padding:8px 14px;box-shadow:0 10px 30px rgba(46,58,41,.2);transition:opacity .2s,transform .2s;white-space:nowrap;text-align:right}
.bubble.on{opacity:1;transform:translate(0,-50%)}
.bubble b{display:block;font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.25rem;line-height:1.1}
.bubble small{font-size:.72rem;color:var(--muted)}

/* ---------- editor (menú escondido) ---------- */
.scrim{position:fixed;inset:0;background:rgba(43,37,31,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.editor{position:fixed;left:0;right:0;bottom:0;max-height:92dvh;background:var(--paper);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .35s ease;z-index:60;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.editor.open{transform:none}
@media (min-width:760px){.editor{left:auto;top:0;width:440px;max-height:none;border-radius:24px 0 0 24px;transform:translateX(105%)}}
.ed-head,.ed-status,.ed-tabs,.ed-foot{flex-shrink:0}
.ed-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
.ed-head h3{font-family:var(--serif);font-style:italic;font-size:1.6rem;font-weight:600;color:var(--forest)}
.ed-x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;font-size:1.2rem;color:var(--ink)}
.ed-status{padding:0 20px;font-size:.75rem;color:var(--muted)}
.ed-status.warn{color:var(--terra)}
.ed-tabs{display:flex;gap:6px;padding:12px 20px;overflow-x:auto;border-bottom:1px solid var(--line)}
.ed-tabs button{flex:0 0 auto;border:1px solid var(--line);background:none;border-radius:99px;padding:7px 14px;font-size:.85rem;color:var(--ink);white-space:nowrap}
.ed-tabs button.on{background:var(--forest);border-color:var(--forest);color:var(--cream)}
.ed-body{flex:1;overflow-y:auto;padding:16px 20px 20px}
.ed-foot{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 14px;font-size:.85rem;color:var(--ink)}
.btn.main{background:var(--cafe);border-color:var(--cafe);color:var(--cream)}
.btn.ghost{background:none}
.btn.danger{color:var(--terra);border-color:#ebc9b3;background:none}
.btn.sm{padding:6px 10px;font-size:.78rem;border-radius:10px}
.eb{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;background:#fff}
.eb-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:500;font-size:.85rem;color:var(--cafe-d)}
.eb-h .tools{display:flex;gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:block;margin-bottom:8px}
.f span{display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:16px;font-weight:400;background:var(--paper);color:var(--ink)}
.f textarea{min-height:64px;resize:vertical}
.thumb{display:flex;align-items:center;gap:8px;margin:-2px 0 8px}
.thumb img{width:54px;height:54px;object-fit:cover;border-radius:10px}
.tip{font-size:.78rem;color:var(--muted);line-height:1.45;margin:4px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chk{display:flex;gap:8px;align-items:center;font-size:.85rem;margin:4px 0 10px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-220%);visibility:hidden;background:var(--forest);color:var(--cream);padding:10px 18px;border-radius:99px;font-size:.85rem;z-index:80;transition:transform .3s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);visibility:visible}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="stage" class="stage"><main id="page" class="page" aria-live="polite"></main></div>

<div id="dial" class="dial">
  <div id="track" class="track" role="listbox" aria-label="Fechas del viaje"><div id="rail"></div></div>
  <button id="knob" class="knob" aria-label="Cambiar de día: desliza hacia arriba o abajo"><b>✦</b><small>Inicio</small></button>
</div>
<div id="bubble" class="bubble" aria-hidden="true"></div>

<div id="scrim" class="scrim"></div>
<div id="toast" class="toast" role="status"></div>

<aside id="editor" class="editor" aria-hidden="true">
  <div class="ed-head"><h3>Editar itinerario</h3><button class="ed-x" id="edClose" aria-label="Cerrar">✕</button></div>
  <p class="ed-status" id="edStatus"></p>
  <div class="ed-tabs" id="edTabs">
    <button data-tab="days" class="on">Días</button>
    <button data-tab="flights">Vuelos</button>
    <button data-tab="hotels">Hoteles</button>
    <button data-tab="trip">Viaje</button>
  </div>
  <div class="ed-body" id="edBody"></div>
  <div class="ed-foot">
    <button class="btn main" id="btnExport">Descargar itinerario.json</button>
    <button class="btn" id="btnImport">Importar</button>
    <button class="btn danger" id="btnReset">Restaurar del archivo</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</aside>

<script id="seed" type="application/json">{"updated": "2026-11-04T14:50:00Z", "votesUrl": "https://script.google.com/macros/s/AKfycbx-zbi_wU8cJRzmNOs6fYfeYU1_t0H5ay3Q--s5Br-Vvka2bqwPO4uExU_WZkyKAoDkkg/exec", "trip": {"title": "Puerto Rico", "subtitle": "Isla del Encanto", "start": "2026-11-18", "end": "2026-11-24"}, "flights": [{"code": "AV0045", "airline": "Avianca", "leg": "ida", "from": "MEX", "to": "BOG", "depTerm": "1", "arrTerm": "1", "date": "2026-11-18", "dep": "", "arr": "", "status": "confirmado", "note": "Tramo 1 · conexión en Bogotá"}, {"code": "AV0258", "airline": "Avianca", "leg": "ida", "from": "BOG", "to": "SJU", "depTerm": "1", "arrTerm": "D", "date": "2026-11-18", "dep": "", "arr": "", "status": "confirmado", "note": "Tramo 2 · llegada a San Juan"}, {"code": "AV0259", "airline": "Avianca", "leg": "regreso", "from": "SJU", "to": "BOG", "depTerm": "D", "arrTerm": "1", "date": "2026-11-24", "dep": "", "arr": "", "status": "confirmado", "note": "Tramo 1 · conexión en Bogotá"}, {"code": "AV0044", "airline": "Avianca", "leg": "regreso", "from": "BOG", "to": "MEX", "depTerm": "1", "arrTerm": "1", "date": "2026-11-24", "dep": "", "arr": "", "status": "confirmado", "note": "Tramo 2 · llegada a CDMX"}], "hotels": [{"name": "Hotel CDMX · salida", "city": "Ciudad de México", "date": "2026-11-18", "status": "pendiente", "note": "Por definir según el horario del AV0045."}, {"name": "Hospedaje en Vieques", "city": "Vieques", "date": "2026-11-21", "status": "pendiente", "note": "Una noche: sábado 21 al domingo 22."}, {"name": "Hotel CDMX · regreso", "city": "Ciudad de México", "date": "2026-11-24", "status": "pendiente", "note": "Por definir según la hora de llegada del AV0044."}], "days": [{"date": "2026-11-18", "title": "Rumbo a la isla", "cover": "", "activities": [{"time": "", "title": "Cena de llegada", "place": "San Juan", "note": "Después de aterrizar, vamos directo a cenar.", "map": "", "photo": "", "poll": {"id": "d18-cena", "question": "¿Dónde cenamos?", "allowOther": true, "options": [{"label": "Mensho Puerto Rico", "link": "https://www.instagram.com/mensho_puertorico/"}, {"label": "Laut", "link": "https://www.instagram.com/laut_pr/"}]}}]}, {"date": "2026-11-19", "title": "Jueves en San Juan", "cover": "", "activities": [{"time": "", "title": "Plan del jueves", "place": "", "note": "", "map": "", "photo": "", "poll": {"id": "d19-plan", "question": "¿Qué hacemos el jueves?", "allowOther": true, "options": [{"label": "Comer en La Casita Blanca", "link": "https://www.google.com/maps/search/?api=1&query=La+Casita+Blanca+San+Juan+Puerto+Rico"}, {"label": "Paseo por el Viejo San Juan", "link": "https://www.google.com/maps/search/?api=1&query=Viejo+San+Juan"}, {"label": "Tarde de playa", "link": ""}]}}]}, {"date": "2026-11-20", "title": "Noche de LCG", "cover": "", "activities": [{"time": "", "title": "Cena en LCG", "place": "San Juan", "note": "", "map": "", "photo": ""}]}, {"date": "2026-11-21", "title": "Rumbo a Vieques", "cover": "", "activities": [{"time": "", "title": "Salida a Vieques", "place": "Vieques", "note": "Transporte por confirmar.", "map": "", "photo": ""}, {"time": "", "title": "Estadía en Vieques", "place": "Vieques", "note": "", "map": "", "photo": ""}]}, {"date": "2026-11-22", "title": "Regreso de Vieques", "cover": "", "activities": [{"time": "", "title": "Regreso a San Juan", "place": "Vieques", "note": "Los horarios del ferry se publican cada mes en puertoricoferry.com; confirmar antes de elegir.", "map": "", "photo": "", "poll": {"id": "d22-regreso", "question": "¿A qué hora regresamos?", "allowOther": true, "options": [{"label": "Temprano (mañana)", "link": ""}, {"label": "Mediodía", "link": ""}, {"label": "En la tarde", "link": ""}]}}]}, {"date": "2026-11-23", "title": "Kuomo y Toro Verde", "cover": "", "activities": [{"time": "", "title": "Desayuno en Kuomo", "place": "Kuomo Rooftop", "note": "", "map": "https://www.instagram.com/kuomorooftop/", "photo": ""}, {"time": "", "title": "Toro Verde", "place": "Toro Verde Adventure Park, Orocovis", "note": "", "map": "https://www.google.com/maps/search/?api=1&query=Toro+Verde+Adventure+Park+Orocovis", "photo": ""}]}, {"date": "2026-11-24", "title": "De vuelta a casa", "cover": "", "activities": []}]}</script>

<script>
(() => {
const LS_KEY = 'tripPR.v1';
const AIRPORTS = {
  MEX:{ city:'Ciudad de México', name:'Aeropuerto Internacional Benito Juárez (AICM)' },
  BOG:{ city:'Bogotá', name:'Aeropuerto Internacional El Dorado' },
  SJU:{ city:'San Juan', name:'Aeropuerto Internacional Luis Muñoz Marín' },
  PTY:{ city:'Panamá', name:'Aeropuerto Internacional de Tocumen' },
  CUN:{ city:'Cancún', name:'Aeropuerto Internacional de Cancún' }
};
const $ = s => document.querySelector(s);
const stage = $('#stage'), page = $('#page'), dial = $('#dial'), rail = $('#rail'), knob = $('#knob'), trackEl = $('#track'), bubble = $('#bubble'), scrim = $('#scrim');
const editor = $('#editor'), edBody = $('#edBody');
let state, fileData, edTab = 'days', edDay = 0;
const openFolds = new Set();

/* ---------- utilidades ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const asDate = iso => new Date(iso + 'T12:00:00');
const fmt = (iso, o) => iso ? asDate(iso).toLocaleDateString('es-MX', o) : '';
const clone = o => JSON.parse(JSON.stringify(o));
const safeUrl = u => /^(https?:|data:image\/|fotos\/|\.\/|[\w-]+\/)/i.test(u || '') || /^[\w.-]+\.(jpe?g|png|webp|gif)$/i.test(u || '') ? u : '';
const extUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const mapsQ = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function setPath(obj, path, val){
  const k = path.split('.'); let o = obj;
  for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
  o[k[k.length - 1]] = val;
}
function getPath(obj, path){ return path.split('.').reduce((o, k) => o?.[k], obj); }

/* ---------- votaciones ---------- */
let voter = lsGet('tripPR.voter');
if (!voter){ voter = 'v' + Math.random().toString(36).slice(2, 10); lsSet('tripPR.voter', voter); }
let votes = { polls:{}, mine:{} };
let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }
const linkLabel = u => { const m = u.match(/instagram\.com\/([\w.]+)/i); return m ? '@' + m[1] : /maps|goo\.gl/i.test(u) ? 'Mapa ↗' : 'Ver ↗'; };

async function api(body){
  const r = await fetch(state.votesUrl, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, voter }) });
  return r.json();
}
async function loadVotes(){
  if (!state.votesUrl) return;
  try {
    const u = state.votesUrl + (state.votesUrl.includes('?') ? '&' : '?') + 'voter=' + encodeURIComponent(voter);
    const j = await (await fetch(u)).json();
    if (j.polls){ votes = j; renderAll(); }
  } catch(e) { console.warn('Votaciones no disponibles', e); }
}
async function sendVote(id, option, other = false){
  option = option.trim(); if (!state.votesUrl || !option) return;
  const p = votes.polls[id] ||= { counts:{}, closed:false };
  if (p.closed) return toast('Esa votación ya está cerrada');
  const prev = votes.mine[id]; if (prev === option) return;
  if (prev) p.counts[prev] = Math.max(0, (p.counts[prev] || 1) - 1);
  p.counts[option] = (p.counts[option] || 0) + 1; votes.mine[id] = option;
  renderAll(); toast(prev ? 'Voto cambiado ✓' : 'Voto enviado ✓');
  try {
    const j = await api({ action:'vote', poll:id, option, other });
    if (j.polls) votes = j;
    if (j.error === 'cerrada') toast('Esa votación ya está cerrada');
    renderAll();
  } catch(e) { toast('No se pudo enviar el voto. Revisa tu conexión.'); loadVotes(); }
}
async function adminPoll(id, action){
  const pin = lsGet('tripPR.pin');
  if (!pin) return toast('Primero pon tu PIN en la pestaña Viaje');
  try {
    const j = await api({ action, poll:id, pin });
    if (j.error === 'pin') return toast('PIN incorrecto');
    if (j.polls){ votes = j; renderAll(); renderEditor(); toast(action === 'close' ? 'Votación cerrada' : 'Votación reabierta'); }
  } catch(e) { toast('No se pudo conectar con la hoja.'); }
}

function pollHtml(poll){
  const res = votes.polls[poll.id] || { counts:{}, closed:false };
  const closed = !!res.closed, mine = votes.mine[poll.id], live = !!state.votesUrl;
  const defined = (poll.options || []).filter(o => o.label);
  const extra = Object.keys(res.counts).filter(k => res.counts[k] > 0 && !defined.some(o => o.label === k)).map(label => ({ label }));
  const all = [...defined, ...extra];
  const total = all.reduce((s,o) => s + (res.counts[o.label] || 0), 0);
  const max = Math.max(0, ...all.map(o => res.counts[o.label] || 0));
  const show = !!mine || closed;
  const opts = all.map(o => {
    const n = res.counts[o.label] || 0, pct = total ? Math.round(n * 100 / total) : 0, link = extUrl(o.link);
    const win = closed && n === max && n > 0;
    return `<div class="opt ${mine === o.label ? 'mine' : ''} ${win ? 'win' : ''}">
      <span class="bar" style="width:${show ? pct : 0}%"></span>
      <button class="lbl" data-vote="${esc(poll.id)}" data-opt="${esc(o.label)}" ${closed || !live ? 'disabled' : ''}>${mine === o.label ? '✓ ' : ''}${win ? '★ ' : ''}${esc(o.label)}</button>
      ${link || show ? `<span class="meta">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(linkLabel(link))}</a>` : ''}${show ? `<span class="pct">${n} · ${pct}%</span>` : ''}</span>` : ''}
    </div>`;
  }).join('');
  const foot = !live ? 'Votación aún sin conectar.' : closed ? 'Votación cerrada.' : mine ? 'Puedes cambiar tu voto tocando otra opción.' : 'Toca una opción para votar.';
  return `<div class="poll">
    <div class="poll-q"><span>${esc(poll.question || 'Votación')}</span><span class="badge ${closed ? 'warn' : 'ok'}">${closed ? 'Cerrada' : 'Abierta'}</span></div>
    ${opts}
    ${poll.allowOther && live && !closed ? `<form class="poll-other" data-other="${esc(poll.id)}"><input name="o" maxlength="60" placeholder="Proponer otra opción…" autocomplete="off"><button class="btn sm">Proponer</button></form>` : ''}
    <p class="poll-foot">${foot}</p>
  </div>`;
}

function normalize(){
  state.trip ||= { title:'Mi viaje', subtitle:'', start:'', end:'' };
  state.flights ||= []; state.hotels ||= []; state.days ||= [];
  state.days.forEach(d => { d.activities ||= []; });
}

/* ---------- carga ---------- */
async function load(){
  const seed = JSON.parse($('#seed').textContent);
  fileData = seed;
  try {
    const r = await fetch('itinerario.json', { cache:'no-store' });
    if (r.ok) fileData = await r.json();
  } catch(e) {}
  let local = null;
  try { local = JSON.parse(localStorage.getItem(LS_KEY)); } catch(e) {}
  const newer = local && Date.parse(local.updated || 0) > Date.parse(fileData.updated || 0);
  state = newer ? local : clone(fileData);
  normalize(); renderAll();
  if (location.hash === '#editar') openEditor();
  loadVotes();
}

/* ---------- vistas ---------- */
const sunSvg = `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="32" cy="32" r="11"/>${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6,r1=17,r2=i%2?23:27;return `<line x1="${32+r1*Math.cos(a)}" y1="${32+r1*Math.sin(a)}" x2="${32+r2*Math.cos(a)}" y2="${32+r2*Math.sin(a)}"/>`}).join('')}</svg>`;
const chev = `<span class="chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span>`;

function countdown(){
  const { start, end } = state.trip; if (!start) return '';
  const today = new Date(); today.setHours(12,0,0,0);
  const ds = Math.round((asDate(start) - today) / 864e5);
  const de = end ? Math.round((asDate(end) - today) / 864e5) : ds;
  if (ds > 1) return `Faltan ${ds} días`;
  if (ds === 1) return '¡Es mañana!';
  if (ds === 0) return '¡Hoy empieza!';
  if (de >= 0) return `Día ${1 - ds} del viaje`;
  return 'Viaje completado ✦';
}

const fold = (key, cls, summary, body) =>
  `<details class="fold ${cls}" data-key="${esc(key)}" ${openFolds.has(key) ? 'open' : ''}><summary>${summary}${chev}</summary><div class="fold-body">${body}</div></details>`;

function flightRow(f, scope){
  const ok = f.status === 'confirmado';
  const A = AIRPORTS[f.from] || {}, B = AIRPORTS[f.to] || {};
  const num = (f.code || '').replace(/^([A-Z]{2})0*/i, '$1');
  const tm = v => v ? `<span class="tm">${esc(v)}</span>` : `<span class="tm tbd">Hora por confirmar</span>`;
  const pt = (lbl, code, ap, term, t) => `<div class="pt"><small>${lbl}</small><b>${esc(code)}</b>
    <div class="ap">${esc(ap.name || '')}${ap.city ? `<br><span style="color:var(--muted)">${esc(ap.city)}</span>` : ''}</div>
    ${term ? `<span class="term">Terminal ${esc(term)}</span>` : ''}${tm(t)}</div>`;
  const summary = `<span class="dot ${ok ? 'ok' : 'warn'}" title="${ok ? 'Confirmado' : 'Pendiente'}"></span>
    ${safeUrl(f.logo) ? `<img class="fl-logo" src="${esc(safeUrl(f.logo))}" alt="${esc(f.airline || '')}">` : ''}<span class="fl-code">${esc(f.code || 'Vuelo')}</span>
    <span class="fl-route">${esc(f.from)}<i>→</i>${esc(f.to)}</span>
    <span class="fl-time">${esc(f.dep || '')}</span>`;
  const body = `<div class="fl-top">${safeUrl(f.logo) ? `<img class="al-logo" src="${esc(safeUrl(f.logo))}" alt="${esc(f.airline || '')}">` : f.airline ? `<span class="airline">${esc(f.airline)}</span>` : '<span></span>'}<span class="badge ${ok ? 'ok' : 'warn'}">${ok ? 'Confirmado' : 'Pendiente'}</span></div>
    <div class="fl-legs">${pt('Salida', f.from, A, f.depTerm, f.dep)}${pt('Llegada', f.to, B, f.arrTerm, f.arr)}</div>
    <p class="fl-foot">${esc(cap(fmt(f.date,{weekday:'long',day:'numeric',month:'long'})))}${f.note ? ' · ' + esc(f.note) : ''}</p>
    <div class="links">${A.name ? `<a href="${mapsQ(A.name)}" target="_blank" rel="noopener">Cómo llegar a ${esc(f.from)} ↗</a>` : ''}${num ? `<a href="https://www.google.com/search?q=${encodeURIComponent(num + ' estado del vuelo')}" target="_blank" rel="noopener">Estado del ${esc(num)} ↗</a>` : ''}</div>`;
  return fold(`${scope}-f-${f.code}-${f.date}`, '', summary, body);
}
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

function hotelRow(h, scope, i){
  const ok = h.status === 'confirmado';
  const summary = `<span class="dot ${ok ? 'ok' : 'warn'}"></span><span class="ht-name">${esc(h.name || 'Hotel')}</span>`;
  const body = `<p><span class="badge ${ok ? 'ok' : 'warn'}">${ok ? 'Confirmado' : 'No confirmado'}</span></p>
    <p class="muted">${esc(h.city || '')}${h.date ? ' · ' + esc(fmt(h.date,{weekday:'long',day:'numeric',month:'long'})) : ''}</p>
    ${h.note ? `<p>${esc(h.note)}</p>` : ''}
    ${ok && h.name ? `<div class="links"><a href="${mapsQ(h.name + ' ' + (h.city || ''))}" target="_blank" rel="noopener">Ver en el mapa ↗</a></div>` : ''}`;
  return fold(`${scope}-h-${i}`, ok ? '' : 'pending', summary, body);
}

function intro(){
  const t = state.trip;
  const range = t.start ? `${fmt(t.start,{day:'numeric'})} — ${fmt(t.end || t.start,{day:'numeric',month:'short',year:'numeric'})}` : '';
  const legs = ['ida','regreso'].map(l => {
    const fs = state.flights.filter(f => (f.leg || 'ida') === l);
    return fs.length ? `<p class="leg">${l === 'ida' ? 'Ida' : 'Regreso'}</p>${fs.map(f => flightRow(f,'top')).join('')}` : '';
  }).join('');
  return `<section id="s0" data-stop="0">
    <div class="head"><header class="arch">
      <button class="logo" id="logo" aria-label="${esc(t.title)}">${sunSvg}</button>
      <p class="eyebrow">Itinerario de viaje${t.subtitle ? ' · ' + esc(t.subtitle) : ''}</p>
      <h1>${esc(t.title)}</h1>
      <div class="mrow"><span class="dates">${esc(range)}</span><span class="count">${esc(countdown())}</span></div>
    </header></div>
    <div class="vbody">
    ${state.flights.length ? `<h2 class="sec">Vuelos</h2>${legs}` : ''}
    ${state.hotels.length ? `<h2 class="sec">Hospedaje</h2>${state.hotels.map((h,i) => hotelRow(h,'top',i)).join('')}` : ''}
    <h2 class="sec">Los días</h2>
    <ul class="daylist">${state.days.map((d,i) => `<li><button data-go="${i+1}"><span class="n">${d.date ? asDate(d.date).getDate() : i+1}</span><span class="tx"><b>${esc(d.title || 'Día ' + (i+1))}</b><small>Día ${i+1} · ${esc(fmt(d.date,{weekday:'long',day:'numeric',month:'long'}))}</small></span></button></li>`).join('')}</ul>
    <p class="hint">Gira la rueda de la derecha o desliza de lado para cambiar de día ✦</p>
    ${pager(0)}
    </div>
  </section>`;
}

function daySection(d, i){
  const flights = state.flights.filter(f => f.date === d.date);
  const hotels = state.hotels.map((h,k) => [h,k]).filter(([h]) => h.date === d.date);
  const cover = safeUrl(d.cover);
  const acts = d.activities.map(a => {
    const map = extUrl(a.map) || (a.place ? mapsQ(a.place) : '');
    const photo = safeUrl(a.photo);
    return `<li class="act"><div class="act-time">${esc(a.time || '')}</div><div class="act-body">
      <h4>${esc(a.title || 'Actividad')}</h4>
      ${a.place ? `<p class="place">${esc(a.place)}</p>` : ''}
      ${a.note ? `<p class="note">${esc(a.note)}</p>` : ''}
      ${photo ? `<img src="${esc(photo)}" alt="${esc(a.title)}" loading="lazy">` : ''}
      ${a.poll ? pollHtml(a.poll) : ''}
      ${map && !a.poll ? `<a href="${esc(map)}" target="_blank" rel="noopener">${esc(/instagram\.com/i.test(map) ? linkLabel(map) + ' ↗' : 'Ver en el mapa ↗')}</a>` : ''}
    </div></li>`;
  }).join('');
  return `<section class="day ${i % 2 ? 'alt' : ''}" id="s${i+1}" data-stop="${i+1}">
    <div class="head"><header class="day-hero ${cover ? 'has-img' : ''}">
      ${cover ? `<img src="${esc(cover)}" alt="">` : ''}
      <span class="day-num">Día ${i+1}</span>
      <p class="day-date">${esc(fmt(d.date,{weekday:'long',day:'numeric',month:'long'}))}</p>
      <h2 class="day-title">${esc(d.title || '')}</h2>
    </header></div>
    <div class="day-inner vbody">
      ${flights.length ? `<h3 class="sec">Vuelos del día</h3>${flights.map(f => flightRow(f,'d' + i)).join('')}` : ''}
      ${hotels.length ? `<h3 class="sec">Hospedaje</h3>${hotels.map(([h,k]) => hotelRow(h,'d' + i,k)).join('')}` : ''}
      <h3 class="sec">Actividades</h3>
      ${acts ? `<ol class="timeline">${acts}</ol>` : `<div class="empty"><b>Día libre… por ahora</b>Agrega actividades desde el menú de edición.</div>`}
      ${i === state.days.length - 1 ? '<p class="end">¡Buen viaje! ✦</p>' : ''}
      ${pager(i + 1)}
    </div>
  </section>`;
}

function pager(i){
  const lbl = k => k === 0 ? 'Inicio' : `Día ${k} · ${fmt(state.days[k-1]?.date,{weekday:'short',day:'numeric'})}`;
  const n = state.days.length;
  return `<nav class="pager">${i > 0 ? `<button data-go="${i-1}"><small>← Anterior</small><b>${esc(lbl(i-1))}</b></button>` : '<span class="sp"></span>'}${i < n ? `<button class="nx" data-go="${i+1}"><small>Siguiente →</small><b>${esc(lbl(i+1))}</b></button>` : '<span class="sp"></span>'}</nav>`;
}
function renderView(reset){
  const st = stage.scrollTop;
  page.innerHTML = cur === 0 ? intro() : daySection(state.days[cur - 1], cur - 1);
  stage.scrollTop = reset ? 0 : st;
}
function renderAll(){
  cur = clamp(cur, 0, stopCount() - 1);
  renderView(false); buildDial(); pos = cur; paintDial();
}

page.addEventListener('toggle', e => {

/* ---------- bolita tipo zoom de cámara + cambio de pantalla con morph ---------- */
const STEP = 42, PAD = 27;    // separación entre fechas y margen del riel
let cur = 0, pos = 0, dragging = false, open = false, sticky = false, bubbleT, vt, lastWheel = 0, trackTop = 0;
const stopCount = () => state.days.length + 1;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const anchorY = () => Math.round(innerHeight * 0.7);   // altura del pulgar
const trackH = () => (stopCount() - 1) * STEP + PAD * 2;
const stopLabel = i => {
  const d = state.days[i - 1];
  return i === 0 ? ['✦','Inicio'] : [d?.date ? asDate(d.date).getDate() : i, fmt(d?.date,{weekday:'short'}).replace('.','')];
};

function buildDial(){
  const n = stopCount(); let h = '';
  for (let i = 0; i < n; i++){
    const [b, s] = stopLabel(i);
    h += `<button class="stop" data-i="${i}" style="top:${PAD + i * STEP}px" aria-label="${i ? 'Día ' + i : 'Inicio'}"><b>${esc(b)}</b><small>${esc(s)}</small></button>`;
  }
  rail.innerHTML = h;
  trackEl.style.height = trackH() + 'px';
  paintDial();
}
function layoutTrack(){
  trackTop = clamp(anchorY() - PAD - cur * STEP, 14, innerHeight - trackH() - 14);
  trackEl.style.top = trackTop + 'px';
  trackEl.style.transformOrigin = `50% ${anchorY() - trackTop}px`;
  rail.querySelectorAll('.stop').forEach(s => { s.style.transitionDelay = Math.abs(+s.dataset.i - cur) * 25 + 'ms'; });
}
function paintDial(){
  const y = open ? trackTop + PAD + pos * STEP : anchorY();
  const [b, s] = stopLabel(Math.round(pos));
  knob.innerHTML = `<b>${esc(b)}</b><small>${esc(s)}</small>`;
  knob.style.top = y + 'px';
  bubble.style.top = y + 'px';
}
function showBubble(i, stay){
  const d = state.days[i - 1];
  bubble.innerHTML = i === 0
    ? `<b>Inicio</b><small>vuelos y hospedaje</small>`
    : `<b>Día ${i} · ${esc(fmt(d.date,{weekday:'short',day:'numeric',month:'short'}))}</b><small>${esc(d.title || '')}</small>`;
  bubble.classList.add('on');
  clearTimeout(bubbleT);
  if (!stay) bubbleT = setTimeout(() => bubble.classList.remove('on'), 900);
}
function expand(){ if (open) return; layoutTrack(); open = true; dial.classList.add('open'); }
function collapse(){ open = false; sticky = false; pos = cur; dial.classList.remove('open','drag'); paintDial(); showBubble(cur); }

function show(i){
  i = clamp(i, 0, stopCount() - 1);
  if (i === cur){ if (!dragging){ pos = cur; paintDial(); } return; }
  const dir = i > cur ? 'fwd' : 'back';
  document.documentElement.dataset.dir = dir;
  cur = i;
  if (document.startViewTransition && !reduceMotion){
    try { vt && vt.skipTransition(); } catch(e) {}
    vt = document.startViewTransition(() => renderView(true));
    vt.finished.finally(() => { vt = null; });
  } else {
    renderView(true);
    if (!reduceMotion){ page.classList.remove('enter-fwd','enter-back'); void page.offsetWidth; page.classList.add('enter-' + dir); }
  }
  if (!dragging){ pos = cur; paintDial(); }
  if (navigator.vibrate) navigator.vibrate(6);
  showBubble(i, dragging || sticky);
}

let startY = 0, startPos = 0, moved = 0;
knob.addEventListener('pointerdown', e => {
  e.preventDefault();
  dragging = true; moved = 0; startY = e.clientY; startPos = pos = cur;
  expand(); dial.classList.add('drag');
  knob.setPointerCapture(e.pointerId);
  paintDial(); showBubble(cur, true);
  if (navigator.vibrate) navigator.vibrate(8);
});
knob.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dy = e.clientY - startY; moved = Math.max(moved, Math.abs(dy));
  if (moved < 4) return;
  pos = clamp(startPos + dy / STEP, 0, stopCount() - 1);   // tope en Inicio y en el último día
  paintDial();
  const r = Math.round(pos);
  if (r !== cur) show(r);
});
function endDrag(){
  if (!dragging) return;
  dragging = false; dial.classList.remove('drag');
  if (moved < 6 && !sticky){ sticky = true; pos = cur; paintDial(); showBubble(cur, true); return; }   // un toque deja la rueda abierta
  collapse();
}
knob.addEventListener('pointerup', endDrag);
knob.addEventListener('pointercancel', endDrag);
trackEl.addEventListener('click', e => { const s = e.target.closest('.stop'); if (!s) return; show(+s.dataset.i); collapse(); });
document.addEventListener('pointerdown', e => { if (open && !dragging && !e.target.closest('#dial')) collapse(); });
knob.addEventListener('wheel', e => {
  e.preventDefault();
  const now = Date.now(); if (now - lastWheel < 280) return; lastWheel = now;
  show(cur + Math.sign(e.deltaY));
}, { passive:false });
addEventListener('resize', () => { if (open) layoutTrack(); paintDial(); });

/* deslizar de lado sobre la pantalla también cambia de día */
let sx = null, sy = 0, st0 = 0;
stage.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st0 = Date.now(); }, { passive:true });
stage.addEventListener('touchend', e => {
  if (sx === null) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - st0 < 700) show(cur + (dx < 0 ? 1 : -1));
}, { passive:true });

document.addEventListener('keydown', e => {
  if (editor.classList.contains('open') || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); show(cur + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); show(cur - 1); }
  if (e.key === 'E' && e.shiftKey) openEditor();
});

page.addEventListener('click', e => {

['pointerup','pointerleave','pointercancel'].forEach(ev => page.addEventListener(ev, () => clearTimeout(lp)));

/* ---------- guardado ---------- */
let saveT;
function save(){
  state.updated = new Date().toISOString();
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); setStatus(); }
  catch(e){ setStatus('No hay espacio en este dispositivo. Usa fotos de la carpeta fotos/ en lugar de subirlas aquí.', true); }
}
function changed(structural){
  clearTimeout(saveT);
  if (structural){ save(); renderAll(); renderEditor(); }
  else saveT = setTimeout(() => { save(); renderAll(); }, 250);
}
function setStatus(msg, warn){
  const el = $('#edStatus');
  if (msg){ el.textContent = msg; el.classList.toggle('warn', !!warn); return; }
  const dirty = Date.parse(state.updated || 0) > Date.parse(fileData.updated || 0);
  el.textContent = dirty ? 'Cambios guardados en este dispositivo · descarga el JSON y súbelo a GitHub para que se vean en todos lados.' : 'Al día con el archivo publicado.';
  el.classList.toggle('warn', dirty);
}

edBody.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, acts = state.days[edDay]?.activities, j = +b.dataset.j;
  if (act === 'close-poll') return adminPoll(b.dataset.id, 'close');
  if (act === 'open-poll') return adminPoll(b.dataset.id, 'open');
  if (act === 'test-votes'){
    if (!state.votesUrl) return toast('Primero pega la URL');
    fetch(state.votesUrl).then(r => r.json()).then(j => toast(j.polls ? 'Conexión correcta ✓' : 'La URL respondió, pero no parece el script')).catch(() => toast('No se pudo conectar. Revisa la URL y el acceso "Cualquier persona".'));
    return;
  }
  if (act === 'add-poll') acts[j].poll = { id: 'p' + Date.now().toString(36), question: '', allowOther: true, options: [{ label:'', link:'' }, { label:'', link:'' }] };
  if (act === 'del-poll'){ if (!confirm('¿Quitar la votación de esta actividad? Los votos siguen en la hoja.')) return; delete acts[j].poll; }
  if (act === 'add-opt') acts[j].poll.options.push({ label:'', link:'' });
  if (act === 'del-opt') acts[j].poll.options.splice(+b.dataset.k, 1);
  if (act === 'add-flight') state.flights.push({ code:'', airline:'', leg:'ida', from:'', to:'', depTerm:'', arrTerm:'', date: state.trip.start || '', dep:'', arr:'', status:'pendiente', note:'' });
  if (act === 'add-hotel') state.hotels.push({ name:'', city:'', date:'', status:'pendiente', note:'' });
  if (act === 'del'){ if (!confirm('¿Eliminar este elemento?')) return; state[b.dataset.list].splice(+b.dataset.i, 1); }
  if (act === 'add-act') acts.push({ time:'', title:'', place:'', note:'', map:'', photo:'' });
  if (act === 'del-act'){ if (!confirm('¿Eliminar esta actividad?')) return; acts.splice(j, 1); }
  if (act === 'up' && j > 0) [acts[j-1], acts[j]] = [acts[j], acts[j-1]];
  if (act === 'down' && j < acts.length - 1) [acts[j+1], acts[j]] = [acts[j], acts[j+1]];
  if (act === 'sort') acts.sort((a,b) => (a.time || '99').localeCompare(b.time || '99'));
  if (act === 'clear') setPath(state, b.dataset.path, '');
  if (act === 'add-day'){

  changed(true);
  if (act === 'add-act') edBody.scrollTop = edBody.scrollHeight;
});

function compress(file, max = 1400, q = .78){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej; img.src = url;
  });
}

  e.target.value = '';
};
$('#btnReset').onclick = () => {
  if (!confirm('Se borrarán los cambios guardados en este dispositivo y se cargará itinerario.json. ¿Continuar?')) return;
  try { localStorage.removeItem(LS_KEY); } catch(e) {}
  state = clone(fileData); normalize(); renderAll(); renderEditor(); setStatus();
};

load();
})();
</script>
</body>
</html>
